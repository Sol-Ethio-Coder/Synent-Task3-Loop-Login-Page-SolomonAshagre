<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Loop</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #FBF7F0;
    --surface: #FFFFFF;
    --ink: #201D18;
    --ink-soft: #6B6455;
    --rust: #C1440E;
    --pine: #2F5D50;
    --line: #E7E0D3;
    --danger: #C1440E;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  body{
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow: hidden;
  }

  /* background decoration */
  .blob{
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    z-index: 0;
  }
  .blob-a{
    width: 420px; height: 420px;
    background: #EAF1EC;
    top: -140px; left: -140px;
  }
  .blob-b{
    width: 320px; height: 320px;
    background: #FBEBE0;
    bottom: -120px; right: -100px;
  }

  a{ color: inherit; }

  /* ---------- Card ---------- */
  .login-card{
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 44px 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 60px -20px rgba(32,29,24,0.16);
  }

  .brand{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 19px;
    text-decoration: none;
    margin-bottom: 28px;
  }

  .brand .dot{
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--rust);
    box-shadow: 4px 3px 0 var(--pine);
  }

  .card-head{
    text-align: center;
    margin-bottom: 30px;
  }

  .card-head h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }

  .card-head p{
    font-size: 14.5px;
    color: var(--ink-soft);
  }

  /* ---------- Form ---------- */
  form{
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .field label{
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
  }

  .input-shell{
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-shell svg{
    position: absolute;
    left: 14px;
    width: 17px;
    height: 17px;
    stroke: var(--ink-soft);
    pointer-events: none;
  }

  .input-shell input{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px 12px 42px;
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }

  .input-shell input::placeholder{ color: #A79E8C; }

  .input-shell input:focus{
    border-color: var(--pine);
    background: var(--surface);
  }

  .input-shell.has-toggle input{ padding-right: 42px; }

  .toggle-visibility{
    position: absolute;
    right: 12px;
    left: auto;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    pointer-events: auto;
    background: transparent;
    border: none;
  }
  .toggle-visibility svg{
    position: static;
    width: 17px;
    height: 17px;
    stroke: var(--ink-soft);
  }
  .toggle-visibility:hover{ background: var(--line); }

  .field-foot{
    display: flex;
    justify-content: flex-end;
    margin-top: -6px;
  }

  .forgot{
    font-size: 13px;
    font-weight: 600;
    color: var(--pine);
    text-decoration: none;
  }
  .forgot:hover{ text-decoration: underline; }

  .btn-login{
    margin-top: 4px;
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: #FFF6EF;
    background: var(--rust);
    border: none;
    border-radius: 10px;
    padding: 13px 0;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-login:hover{
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(193,68,14,0.28);
  }
  .btn-login:active{ transform: translateY(0); }

  .divider{
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 18px;
    color: var(--ink-soft);
    font-size: 12.5px;
  }
  .divider::before, .divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .social-row{
    display: flex;
    gap: 12px;
  }

  .btn-social{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 0;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  .btn-social:hover{ border-color: var(--ink-soft); }
  .btn-social svg{ width: 17px; height: 17px; }

  .signup-note{
    text-align: center;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-top: 26px;
  }

  .signup-note a{
    font-weight: 600;
    color: var(--rust);
    text-decoration: none;
  }
  .signup-note a:hover{ text-decoration: underline; }

  /* ---------- Responsive ---------- */
  @media (max-width: 460px){
    .login-card{ padding: 36px 24px 30px; border-radius: 16px; }
    .blob-a{ width: 260px; height: 260px; top: -100px; left: -100px; }
    .blob-b{ width: 200px; height: 200px; bottom: -80px; right: -70px; }
    .social-row{ flex-direction: column; }
  }
</style>
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>

<div class="login-card">
  <a href="#" class="brand"><span class="dot"></span>Loop</a>

  <div class="card-head">
    <h1>Welcome back</h1>
    <p>Log in to keep your streak going.</p>
  </div>

  <form onsubmit="return false;">
    <div class="field">
      <label for="email">Email</label>
      <div class="input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/><path d="m3 6 9 7 9-7"/></svg>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="username" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-shell has-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="toggle-visibility" id="toggleVisibility" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="field-foot">
        <a href="#" class="forgot">Forgot password?</a>
      </div>
    </div>

    <button type="submit" class="btn-login">Log in</button>
  </form>

  <div class="divider">or continue with</div>

  <div class="social-row">
    <button type="button" class="btn-social">
      <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.2s2.7-6.2 6-6.2c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.3 14.6 2.3 12 2.3 6.9 2.3 2.7 6.5 2.7 12S6.9 21.7 12 21.7c6.9 0 9.1-4.8 9.1-7.3 0-.5-.05-.9-.13-1.2H12Z"/></svg>
      Google
    </button>
    <button type="button" class="btn-social">
      <svg viewBox="0 0 24 24" fill="none" stroke="#201D18" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C7.1 2.8 6 3.1 6 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.6 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V22"/></svg>
      GitHub
    </button>
  </div>

  <p class="signup-note">Don't have an account? <a href="#">Sign up free</a></p>
</div>

<script>
  const toggleBtn = document.getElementById('toggleVisibility');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  const eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeClosed = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.innerHTML = isPassword ? eyeClosed : eyeOpen;
    toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });
</script>

</body>
</html>
